name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  groovy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch pinned Groovy core
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://repo.maven.apache.org/maven2/org/codehaus/groovy/groovy/3.0.25/groovy-3.0.25.jar \
            --output "$RUNNER_TEMP/groovy.jar"
          echo "ad009e985dd84e4f524f4ed1751866da5bef816b691851bfbcefa48a01180a07  $RUNNER_TEMP/groovy.jar" | sha256sum --check
      - name: Test real planner, rebuild and test assembled entry point
        shell: bash
        run: |
          set -euo pipefail
          java -cp "$RUNNER_TEMP/groovy.jar" groovy.ui.GroovyMain tests/run.groovy
          java -cp "$RUNNER_TEMP/groovy.jar" groovy.ui.GroovyMain tools/build.groovy
          git diff --exit-code -- dist/plan-permission-cover.groovy
          java -cp "$RUNNER_TEMP/groovy.jar" groovy.ui.GroovyMain tests/entrypoint.groovy
          java -cp "$RUNNER_TEMP/groovy.jar" groovy.ui.GroovyMain examples/demo.groovy
