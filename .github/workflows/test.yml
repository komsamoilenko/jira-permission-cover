name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  groovy:
    name: Groovy ${{ matrix.groovy }} / Java 17
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - groovy: '3.0.25'
            url: https://repo.maven.apache.org/maven2/org/codehaus/groovy/groovy/3.0.25/groovy-3.0.25.jar
            sha256: ad009e985dd84e4f524f4ed1751866da5bef816b691851bfbcefa48a01180a07
          - groovy: '4.0.8'
            url: https://repo.maven.apache.org/maven2/org/apache/groovy/groovy/4.0.8/groovy-4.0.8.jar
            sha256: dcb861e7f7b048a7eeecdec27cc02917abc8543cdfbbc8ed3d3aba6e7ffcb2b9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch pinned Groovy core ${{ matrix.groovy }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "${{ matrix.url }}" --output "$RUNNER_TEMP/groovy.jar"
          echo "${{ matrix.sha256 }}  $RUNNER_TEMP/groovy.jar" | sha256sum --check
      - name: Test real planner, rebuild and test assembled entry point
        shell: bash
        run: |
          set -euo pipefail
          java -cp "$RUNNER_TEMP/groovy.jar" groovy.ui.GroovyMain tests/run.groovy
          java -cp "$RUNNER_TEMP/groovy.jar" groovy.ui.GroovyMain tools/build.groovy
          git diff --exit-code -- dist/plan-permission-cover.groovy
          java -cp "$RUNNER_TEMP/groovy.jar" groovy.ui.GroovyMain tests/entrypoint.groovy
          java -cp "$RUNNER_TEMP/groovy.jar" groovy.ui.GroovyMain examples/demo.groovy
